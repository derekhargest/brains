<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brains!!! - Memory System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Brains!!! Memory System (MVP)</h1>
      <nav class="main-nav">
        <ul>
          <li><a href="/" class="active">Home</a></li>
          <li><a href="/memories.html">Memories</a></li>
        </ul>
      </nav>
    </header>
    
    <main>
      <section class="memory-section">
        <h2>Memory Storage</h2>
        <div class="memory-form">
          <textarea id="memoryContent" placeholder="Enter your memory here..."></textarea>
          <div class="memory-metadata">
            <label>
              Importance: 
              <input type="range" id="importanceSlider" min="0" max="1" step="0.1" value="0.5">
              <span id="importanceValue">0.5</span>
            </label>
          </div>
          <button id="storeMemoryBtn">Store Memory</button>
        </div>
      </section>
      
      <section class="search-section">
        <h2>Memory Search</h2>
        <div class="search-form">
          <input type="text" id="searchQuery" placeholder="Search your memories...">
          <button id="searchBtn">Search</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </section>
    </main>
    
    <footer>
      <p>Brains!!! Memory System MVP - For development purposes only</p>
    </footer>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
